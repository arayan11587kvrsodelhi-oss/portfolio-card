<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aryan Sharma | Profile Card</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="2.css">
    <link rel="stylesheet" href="electric-border.css">
    <link rel="stylesheet" href="BorderGlow.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="card"
     data-electric-border
     data-border-glow
     data-color="#7df9ff"
     data-speed="1"
     data-chaos="0.12"
     data-radius="24"
     data-colors="#c084fc,#f472b6,#38bdf8">

    <div class="eb-content">

        <!-- Profile Image -->
        <div class="profile-container">
            <img src="images/aryanpic.jpeg"
                 alt="Aryan Sharma"
                 class="profile-pic">
        </div>

        <!-- Name -->
        <h2>Aryan Sharma</h2>

        <!-- Title -->
        <div class="title">
            TIPS BCA STUDENT
        </div>

        <!-- Description -->
        <div class="description">
            <p>
                Building modern, responsive web applications.
            </p>
        </div>

        <!-- Skills -->
        <div class="skills">

            <h3>Skills</h3>

            <div class="skill-tags">
                <span>HTML</span>
                <span>CSS</span>
                <span>JavaScript</span>
                <span>Node.js</span>
                <span>Git</span>
                <span>GitHub</span>
            </div>

        </div>

        <!-- Contact -->
        <div class="info">
             <p>
                <strong>Phone</strong><br>
                8076233501
            </p>
            <p>
                <strong>Location</strong><br>
                New Delhi, India
            </p>

        </div>

        <!-- Social Icons -->
        <div class="socials">

            <a href="https://www.linkedin.com/in/aryan-sharma-7681a3380/"
               target="_blank"
               title="LinkedIn">

                <i class="fab fa-linkedin"></i>

            </a>

            <a href="mailto:arayan11587kvrsodelhi@gmail.com"
               title="Email">

                <i class="fas fa-envelope"></i>

            </a>

            <a href="https://www.instagram.com/aryan._.5harma/"
               target="_blank"
               title="Instagram">

                <i class="fab fa-instagram"></i>

            </a>

            <a href="https://github.com/arayan11587kvrsodelhi-oss"
               target="_blank"
               title="GitHub">

                <i class="fab fa-github"></i>

            </a>

        </div>

    </div>

</div>

<script src="electric-border.js"></script>
<script src="BorderGlow.js"></script>

</body>
</html>
